<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { margin:0; padding:0; background:#f8fafc; font-family: Arial, Helvetica, sans-serif; color:#1e293b; }
  .wrapper { max-width:600px; margin:0 auto; padding:24px 16px; }
  .card { background:#ffffff; border-radius:10px; overflow:hidden; border:1px solid #e2e8f0; }
  .header { background:#0f1b3d; padding:20px 24px; }
  .header .logo { color:#ffffff; font-size:20px; font-weight:700; text-decoration:none; }
  .header .logo .accent { color:#7ea8ff; }
  .body { padding:24px; }
  .body h1 { color:#0f1b3d; font-size:20px; margin:0 0 12px; }
  .body p { line-height:1.6; font-size:14px; margin:0 0 16px; }
  .btn { display:inline-block; background:#2563eb; color:#ffffff !important; padding:12px 22px; border-radius:8px; text-decoration:none; font-weight:600; font-size:14px; }
  .badge { display:inline-block; background:#fff7e6; color:#a06a00; font-size:12px; font-weight:700; padding:4px 10px; border-radius:100px; margin-bottom:12px; }
  .meta { font-size:13px; color:#475569; margin:0 0 4px; }
  .footer { padding:20px 24px; text-align:center; font-size:12px; color:#94a3b8; }
  .footer a { color:#94a3b8; }
</style>
</head>
<body>
<div class="wrapper">
  <div class="card">
    <div class="header">
      <span class="logo">Schola<span class="accent">rra</span></span>
    </div>
    <div class="body">
      {% block content %}{% endblock %}
    </div>
  </div>
  <div class="footer">
    You're receiving this because you subscribed to Scholarra scholarship alerts.<br>
    {% block footer_extra %}<a href="{{ unsubscribe_link }}">Unsubscribe</a>{% endblock %}
  </div>
</div>
</body>
</html>
