<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Saved Scholarships</title>
</head>
<body>
    <h1>Your Saved Scholarships</h1>

    {% if scholarships %}
        <ul>
        {% for scholarship in scholarships %}
            <li>
                <a href="{% url 'scholarship_detail' scholarship.slug %}">{{ scholarship.title }}</a>
                — {{ scholarship.country.name }}
                — Deadline: {{ scholarship.deadline }}
            </li>
        {% endfor %}
        </ul>
    {% else %}
        <p>You haven't saved any scholarships yet.</p>
    {% endif %}

    <p><a href="{% url 'home' %}">&larr; Back to homepage</a></p>
</body>
</html>
