{% extends "myapp/dashboard_base.html" %}
{% block title %}Scholarship Form{% endblock %}
{% block content %}
<h1>Scholarship</h1>
<div class="form-card" style="max-width: 640px;">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save</button>
    </form>
</div>
<p><a href="{% url 'admin_scholarship_list' %}">&larr; Back to list</a></p>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const sourceField = document.getElementById("id_title");
    const slugField = document.getElementById("id_slug");
    let slugEdited = false;
    if (slugField) {
        slugField.addEventListener("input", function () { slugEdited = true; });
    }
    if (sourceField && slugField) {
        sourceField.addEventListener("input", function () {
            if (slugEdited) return;
            slugField.value = sourceField.value
                .toLowerCase().trim()
                .replace(/[^a-z0-9\s-]/g, "")
                .replace(/\s+/g, "-")
                .replace(/-+/g, "-");
        });
    }
});
</script>
{% endblock %}
