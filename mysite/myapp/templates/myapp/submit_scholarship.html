<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Submit a Scholarship</title></head>
<body>
    <h1>Have a Scholarship Opportunity?</h1>
    <p>Submit it below — our team will review it before it goes live.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Submit for Review</button>
    </form>
    <p><a href="{% url 'home' %}">&larr; Back to home</a></p>
</body>
</html>
