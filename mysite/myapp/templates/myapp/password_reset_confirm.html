<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Set New Password</title></head>
<body>
    <h1>Set a New Password</h1>
    {% if validlink %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Change Password</button>
        </form>
    {% else %}
        <p>This reset link is invalid or has expired. <a href="{% url 'password_reset' %}">Request a new one</a>.</p>
    {% endif %}
</body>
</html>
