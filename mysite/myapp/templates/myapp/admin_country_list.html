{% extends "myapp/dashboard_base.html" %}
{% block title %}Manage Countries{% endblock %}
{% block content %}
<h1>Manage Countries</h1>
<p><a href="{% url 'admin_country_add' %}">+ Add New Country</a></p>
<table border="1">
    <tr><th>Name</th><th>Slug</th><th>Actions</th></tr>
    {% for country in countries %}
    <tr>
        <td>{{ country.name }}</td>
        <td>{{ country.slug }}</td>
        <td>
            <a href="{% url 'admin_country_edit' country.pk %}">Edit</a>
            | <a href="{% url 'admin_country_delete' country.pk %}">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
