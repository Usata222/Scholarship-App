<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Country</title>
</head>
<body>
    <h1>Delete "{{ country.name }}"?</h1>

    {% if scholarship_count > 0 %}
        <p style="color: red;">
            Warning: this country has {{ scholarship_count }} scholarship(s) attached.
            Deleting it will delete all of them too. This cannot be undone.
        </p>
    {% else %}
        <p>This cannot be undone.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, Delete It</button>
    </form>

    <p><a href="{% url 'admin_country_list' %}">Cancel, go back</a></p>
</body>
</html>
