{% extends "myapp/dashboard_base.html" %}
{% block title %}Delete Scholarship{% endblock %}
{% block content %}
<h1>Delete "{{ scholarship.title }}"?</h1>
<div class="alert alert-error">This cannot be undone.</div>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete It</button>
</form>
<p><a href="{% url 'admin_scholarship_list' %}">Cancel, go back</a></p>
{% endblock %}
