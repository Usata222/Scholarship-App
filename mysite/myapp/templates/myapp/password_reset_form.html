{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | ScholarHub</title>
    <link rel="stylesheet" href="{% static 'myapp/style.css' %}">
</head>
<body style="background: var(--navy); min-height: 100vh; display: flex; align-items: center; justify-content: center;">
    <div class="form-card" style="width: 100%; max-width: 380px;">
        <h1>Reset Your Password</h1>
        <p>Enter your admin email and we'll send you a link to reset your password.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
        </form>
        <p style="text-align:center; margin-top: 1rem;"><a href="{% url 'admin_login' %}">&larr; Back to login</a></p>
    </div>
</body>
</html>
