{% extends "myapp/dashboard_base.html" %}
{% block title %}Country Form{% endblock %}
{% block content %}
<h1>Country</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
</form>
<p><a href="{% url 'admin_country_list' %}">&larr; Back to list</a></p>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const sourceField = document.getElementById("id_name");
    const slugField = document.getElementById("id_slug");
    let slugEdited = false;
    if (slugField) {
        slugField.addEventListener("input", function () { slugEdited = true; });
    }
    if (sourceField && slugField) {
        sourceField.addEventListener("input", function () {
            if (slugEdited) return;
            slugField.value = sourceField.value
                .toLowerCase().trim()
                .replace(/[^a-z0-9\s-]/g, "")
                .replace(/\s+/g, "-")
                .replace(/-+/g, "-");
        });
    }
});
</script>
{% endblock %}
